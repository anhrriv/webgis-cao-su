<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>WebGIS Quản lý vườn cao su</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}


/* =====================================================
   HEADER
===================================================== */

#header{

    height:64px;

    background:
    linear-gradient(
        90deg,
        #14532d,
        #1b5e20,
        #2e7d32
    );

    color:white;

    display:flex;

    align-items:center;

    padding:0 20px;

    box-shadow:
    0 2px 5px
    rgba(0,0,0,0.25);

    position:relative;

    z-index:1000;
}


.logo{

    font-size:32px;

    margin-right:12px;
}


.header-title{

    font-size:21px;

    font-weight:bold;

}


.header-subtitle{

    font-size:12px;

    margin-top:4px;

    opacity:.9;
}


/* =====================================================
   LAYOUT
===================================================== */

#container{

    display:flex;

    width:100%;

    height:
    calc(100vh - 64px);
}


/* =====================================================
   SIDEBAR
===================================================== */

#sidebar{

    width:350px;

    min-width:350px;

    height:100%;

    background:#f5f7f5;

    border-right:
    1px solid #ccc;

    overflow-y:auto;

    padding:14px;
}


.section{

    background:white;

    border:
    1px solid #ddd;

    border-radius:7px;

    padding:12px;

    margin-bottom:12px;

    box-shadow:
    0 1px 3px
    rgba(0,0,0,.08);
}


.section-title{

    font-size:14px;

    font-weight:bold;

    color:#1b5e20;

    border-bottom:
    2px solid #e8f5e9;

    padding-bottom:7px;

    margin-bottom:10px;
}


/* =====================================================
   STATUS
===================================================== */

#status{

    padding:8px;

    background:#fff8e1;

    color:#795548;

    border-radius:5px;

    font-size:12px;

    margin-bottom:10px;
}


#status.success{

    background:#e8f5e9;

    color:#2e7d32;
}


#status.error{

    background:#ffebee;

    color:#c62828;
}


/* =====================================================
   LAYER
===================================================== */

.layer-item{

    display:flex;

    align-items:center;

    gap:8px;

    padding:7px;

    cursor:pointer;
}


.layer-item input{

    width:17px;

    height:17px;
}


/* =====================================================
   SEARCH
===================================================== */

.search-label{

    display:block;

    font-size:12px;

    font-weight:bold;

    margin-bottom:5px;

    color:#555;
}


#searchInput{

    width:100%;

    padding:10px;

    border:
    1px solid #bbb;

    border-radius:5px;

    font-size:14px;

    outline:none;
}


#searchInput:focus{

    border-color:#2e7d32;

    box-shadow:
    0 0 0 2px
    rgba(46,125,50,.12);
}


.button-row{

    display:flex;

    gap:7px;

    margin-top:8px;
}


.btn{

    flex:1;

    padding:9px;

    border:none;

    border-radius:5px;

    cursor:pointer;

    font-weight:bold;

    font-size:13px;
}


.btn-primary{

    background:#2e7d32;

    color:white;
}


.btn-primary:hover{

    background:#1b5e20;
}


.btn-secondary{

    background:#e0e0e0;

    color:#333;
}


/* =====================================================
   FILTER
===================================================== */

.filter{

    width:100%;

    padding:8px;

    margin-bottom:7px;

    border:
    1px solid #bbb;

    border-radius:5px;

    background:white;
}


/* =====================================================
   STATISTICS
===================================================== */

.stat-grid{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:8px;
}


.stat-card{

    background:#f5f9f5;

    border:
    1px solid #d9ead9;

    border-radius:6px;

    padding:10px;

    text-align:center;
}


.stat-value{

    font-size:19px;

    font-weight:bold;

    color:#1b5e20;
}


.stat-label{

    font-size:11px;

    color:#666;

    margin-top:3px;
}


/* =====================================================
   INFO
===================================================== */

#infoContent{

    font-size:13px;

    line-height:1.45;
}


.info-empty{

    color:#777;

    font-style:italic;

    text-align:center;

    padding:10px;
}


.info-table{

    width:100%;

    border-collapse:collapse;
}


.info-table tr{

    border-bottom:
    1px solid #eee;
}


.info-table td{

    padding:6px 3px;

    vertical-align:top;
}


.info-key{

    width:43%;

    font-weight:bold;

    color:#444;
}


.info-value{

    word-break:break-word;
}


/* =====================================================
   MAP
===================================================== */

#map{

    flex:1;

    height:100%;

    position:relative;
}


.map-title{

    position:absolute;

    top:12px;

    left:50%;

    transform:
    translateX(-50%);

    z-index:500;

    background:
    rgba(255,255,255,.93);

    padding:
    8px 15px;

    border-radius:5px;

    box-shadow:
    0 2px 7px
    rgba(0,0,0,.25);

    font-weight:bold;

    color:#1b5e20;

    pointer-events:none;
}


/* =====================================================
   POPUP
===================================================== */

.popup-title{

    color:#1b5e20;

    font-size:16px;

    font-weight:bold;

    margin-bottom:8px;

    border-bottom:
    2px solid #e8f5e9;

    padding-bottom:5px;
}


.popup-row{

    font-size:12px;

    margin-bottom:4px;
}


.popup-key{

    font-weight:bold;
}


/* =====================================================
   LEGEND
===================================================== */

.legend{

    background:white;

    padding:10px;

    border-radius:5px;

    box-shadow:
    0 1px 5px
    rgba(0,0,0,.3);

    font-size:12px;
}


.legend-title{

    font-weight:bold;

    margin-bottom:7px;
}


.legend-item{

    display:flex;

    align-items:center;

    margin:4px 0;
}


.legend-color{

    width:22px;

    height:14px;

    margin-right:6px;

    border:1px solid #777;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:800px){

    #sidebar{

        width:290px;

        min-width:290px;
    }

    .header-title{

        font-size:16px;
    }

    .header-subtitle{

        display:none;
    }

}

</style>

</head>


<body>

    </div>

        </div>

<!-- =====================================================

<div id="container">


<!-- =====================================================

===================================================== -->

<!-- =====================================================

<div class="section">

<!-- =====================================================

<div class="section">

<label class="search-label">

<!-- =====================================================

<div class="section">

<div class="stat-grid">

>

<div class="stat-label">

</div>

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">

<script>


// ========================================================
// CẤU HÌNH
// ========================================================

const GEOJSON_URL =
    "lo.geojson";


// ========================================================
// KHỞI TẠO MAP
// ========================================================

const map =
    L.map("map")
    .setView(
        [13.75,108.0],
        10
    );


// ========================================================
// OPEN STREET MAP
// ========================================================

const osm =
    L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

            maxZoom:20,

            attribution:
            "&copy; OpenStreetMap contributors"

        }

    );


// ========================================================
// ẢNH VỆ TINH ESRI
// ========================================================

const satellite =
    L.tileLayer(

        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

        {

            maxZoom:20,

            attribution:
            "Tiles &copy; Esri"

        }

    );


// Mặc định
osm.addTo(map);


// ========================================================
// BIẾN
// ========================================================

let loLayer = null;

let allFeatures = [];

let filteredLayer = null;

let selectedLayer = null;


// ========================================================
// DOM
// ========================================================

const statusBox =
    document.getElementById(
        "status"
    );

const infoContent =
    document.getElementById(
        "infoContent"
    );

const totalLots =
    document.getElementById(
        "totalLots"
    );

const totalArea =
    document.getElementById(
        "totalArea"
    );


// ========================================================
// STATUS
// ========================================================

function setStatus(
    text,
    type=""
){

    statusBox.textContent =
        text;

    statusBox.className =
        "";

    if(type){

        statusBox.classList.add(
            type
        );

    }

}


// ========================================================
// ESCAPE HTML
// ========================================================

function escapeHtml(value){

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


// ========================================================
// FORMAT NUMBER
// ========================================================

function formatNumber(
    value,
    decimals=2
){

    const n =
        Number(value);

    if(
        !Number.isFinite(n)
    ){

        return value;

    }

    return n.toLocaleString(
        "vi-VN",
        {

            minimumFractionDigits:
                decimals,

            maximumFractionDigits:
                decimals

        }
    );

}


// ========================================================
// TÌM TRƯỜNG DIỆN TÍCH
// ========================================================

function findAreaField(
    properties
){

    const candidates = [

        "DT_2024",
        "DT_bando",
        "DT_2023"

    ];


    for(
        const field
        of candidates
    ){

        if(
            properties[field] !==
            undefined
        ){

            return field;

        }

    }


    return null;

}


// ========================================================
// TÍNH THỐNG KÊ
// ========================================================

function updateStatistics(
    features
){

    totalLots.textContent =
        features.length
        .toLocaleString(
            "vi-VN"
        );


    let area = 0;


    features.forEach(
        feature => {

            const p =
                feature.properties ||
                {};


            const field =
                findAreaField(p);


            if(field){

                const value =
                    Number(
                        p[field]
                    );


                if(
                    Number.isFinite(value)
                ){

                    area += value;

                }

            }

        }
    );


    totalArea.textContent =
        formatNumber(
            area,
            2
        ) + " ha";

}


// ========================================================
// STYLE LÔ
// ========================================================

function styleLo(){

    return {

        color:"#176b2c",

        weight:1,

        fillColor:"#66bb6a",

        fillOpacity:.55

    };

}


// ========================================================
// HIGHLIGHT
// ========================================================

function highlightFeature(e){

    e.target.setStyle({

        weight:3,

        color:"#ff0000",

        fillColor:"#81c784",

        fillOpacity:.8

    });

}


// ========================================================
// RESET HIGHLIGHT
// ========================================================

function resetHighlight(e){

    if(
        loLayer
    ){

        loLayer.resetStyle(
            e.target
        );

    }

}


// ========================================================
// HIỂN THỊ THÔNG TIN LÔ
// ========================================================

function showInfo(
    p
){

    if(!p){

        return;

    }


    const namTrong =
        parseInt(
            p.Nam_trong
        );


    let tuoi = "";


    if(
        namTrong >= 1900
    ){

        tuoi =
            new Date()
            .getFullYear()
            - namTrong;

    }


    let html = `

<table class="info-table">


<tr>
<td class="info-key">
Mã lô mới
</td>

<td class="info-value">
${escapeHtml(p.Tenlo_moi || "")}
</td>
</tr>


<tr>
<td class="info-key">
Mã lô cũ
</td>

<td>
${escapeHtml(p.Tenlo_cu || "")}
</td>
</tr>


<tr>
<td class="info-key">
Vùng
</td>

<td>
${escapeHtml(p.Vung || "")}
</td>
</tr>


<tr>
<td class="info-key">
Khu vực
</td>

<td>
${escapeHtml(p.Khu_vuc || "")}
</td>
</tr>


<tr>
<td class="info-key">
Công ty
</td>

<td>
${escapeHtml(p.Congty || "")}
</td>
</tr>


<tr>
<td class="info-key">
Đơn vị
</td>

<td>
${escapeHtml(p.NT_doi || "")}
</td>
</tr>


<tr>
<td class="info-key">
Năm trồng
</td>

<td>
${escapeHtml(p.Nam_trong || "")}
</td>
</tr>


<tr>
<td class="info-key">
Tuổi cây
</td>

<td>
${tuoi ? tuoi + " năm" : ""}
</td>
</tr>


<tr>
<td class="info-key">
Giống
</td>

<td>
${escapeHtml(p.Giong || "")}
</td>
</tr>


<tr>
<td class="info-key">
Hạng đất
</td>

<td>
${escapeHtml(p.Hang_dat || "")}
</td>
</tr>


<tr>
<td class="info-key">
Cao trình
</td>

<td>
${formatNumber(p.Caotrinh,0)} m
</td>
</tr>


<tr>
<td class="info-key">
Khoảng cách
</td>

<td>
${escapeHtml(p.KC || "")}
</td>
</tr>


<tr>
<td class="info-key">
Mật độ
</td>

<td>
${escapeHtml(p.Mat_do || "")}
</td>
</tr>


<tr>
<td class="info-key">
Mật độ cạo
</td>

<td>
${formatNumber(p.Matdo_CC,0)}
</td>
</tr>


<tr>
<td class="info-key">
Diện tích bản đồ
</td>

<td>
${formatNumber(p.DT_bando,2)}
 ha
</td>
</tr>


<tr>
<td class="info-key">
Diện tích 2024
</td>

<td>
${formatNumber(p.DT_2024,2)}
 ha
</td>
</tr>


<tr>
<td class="info-key">
Hiện trạng
</td>

<td>
${escapeHtml(p.Hien_trang || "")}
</td>
</tr>


<tr>
<td class="info-key">
Phân loại vườn cây
</td>

<td>
${escapeHtml(p.Phanloai_VC || "")}
</td>
</tr>


<tr>
<td class="info-key">
Loại vườn
</td>

<td>
${escapeHtml(p.HT_Loaivuon || "")}
</td>
</tr>


</table>


<hr>


<b>📈 NĂNG SUẤT (kg/ha)</b>


<table class="info-table">


<tr>
<td>2017</td>
<td>${formatNumber(p.NS_2017,2)}</td>
</tr>


<tr>
<td>2018</td>
<td>${formatNumber(p.NS_2018,2)}</td>
</tr>


<tr>
<td>2019</td>
<td>${formatNumber(p.NS_2019,2)}</td>
</tr>


<tr>
<td>2020</td>
<td>${formatNumber(p.NS_2020,2)}</td>
</tr>


<tr>
<td>2021</td>
<td>${formatNumber(p.NS_2021,2)}</td>
</tr>


<tr>
<td>2022</td>
<td>${formatNumber(p.NS_2022,2)}</td>
</tr>


<tr>
<td>2023</td>
<td>${formatNumber(p.NS_2023,2)}</td>
</tr>


</table>

`;


    infoContent.innerHTML =
        html;

}


// ========================================================
// POPUP
// ========================================================

function createPopup(
    p
){

    return `

<div class="popup-title">

🌳 ${escapeHtml(
    p.Tenlo_moi ||
    p.Tenlo_cu ||
    "Lô cao su"
)}

</div>


<div class="popup-row">

<b>Giống:</b>

${escapeHtml(
    p.Giong || ""
)}

</div>


<div class="popup-row">

<b>Năm trồng:</b>

${escapeHtml(
    p.Nam_trong || ""
)}

</div>


<div class="popup-row">

<b>Diện tích:</b>

${formatNumber(
    p.DT_2024 ||
    p.DT_bando,
    2
)} ha

</div>


<div class="popup-row">

<b>Hiện trạng:</b>

${escapeHtml(
    p.Hien_trang || ""
)}

</div>


<div class="popup-row">

<b>Năng suất 2023:</b>

${formatNumber(
    p.NS_2023,
    2
)} kg/ha

</div>

`;

}


// ========================================================
// XỬ LÝ FEATURE
// ========================================================

function onEachFeature(
    feature,
    layer
){

    const p =
        feature.properties ||
        {};


    layer.bindPopup(

        createPopup(p),

        {
            maxWidth:350
        }

    );


    layer.on({

        mouseover:
            highlightFeature,

        mouseout:
            resetHighlight,

        click:
            function(){

                if(
                    selectedLayer
                ){

                    loLayer.resetStyle(
                        selectedLayer
                    );

                }


                selectedLayer =
                    layer;


                layer.setStyle({

                    weight:4,

                    color:"#d32f2f",

                    fillColor:"#ffb74d",

                    fillOpacity:.85

                });


                showInfo(p);

                layer.openPopup();

            }

    });

}


// ========================================================
// TẢI GEOJSON
// ========================================================

async function loadGeoJSON(){

    try{

        setStatus(
            "Đang tải dữ liệu lô..."
        );


        const response =
            await fetch(
                GEOJSON_URL
            );


        if(
            !response.ok
        ){

            throw new Error(
                "Không tìm thấy lo.geojson"
            );

        }


        const data =
            await response.json();


        if(
            !data.features
        ){

            throw new Error(
                "GeoJSON không hợp lệ"
            );

        }


        allFeatures =
            data.features;


        loLayer =
            L.geoJSON(

                data,

                {

                    style:
                        styleLo,

                    onEachFeature:
                        onEachFeature

                }

            ).addTo(map);


        const bounds =
            loLayer.getBounds();


        if(
            bounds.isValid()
        ){

            map.fitBounds(
                bounds,
                {
                    padding:[20,20]
                }
            );

        }


        updateStatistics(
            allFeatures
        );


        populateFilters();


        L.control.layers(

            {

                "🗺️ Bản đồ đường":
                    osm,

                "🛰️ Ảnh vệ tinh":
                    satellite

            },

            {

                "🌳 Lô cao su":
                    loLayer

            },

            {

                collapsed:false

            }

        ).addTo(map);


        addLegend();


        setStatus(

            "Đã tải " +
            allFeatures.length +
            " lô cao su.",

            "success"

        );

    }


    catch(error){

        console.error(error);


        setStatus(
            "Lỗi tải GeoJSON",
            "error"
        );


        infoContent.innerHTML = `

<div style="color:#c62828">

<b>
Không tải được lo.geojson
</b>

<br><br>

Kiểm tra file:

<br>

<b>
lo.geojson
</b>

<br><br>

và bảo đảm file nằm cùng thư mục
với index.html.

<br><br>

${escapeHtml(
    error.message
)}

</div>

`;

    }

}


// ========================================================
// TẠO BỘ LỌC
// ========================================================

function populateFilters(){

    const giongSet =
        new Set();

    const hienTrangSet =
        new Set();

    const namSet =
        new Set();


    allFeatures.forEach(
        feature => {

            const p =
                feature.properties ||
                {};


            if(
                p.Giong
            ){

                giongSet.add(
                    p.Giong
                );

            }


            if(
                p.Hien_trang
            ){

                hienTrangSet.add(
                    p.Hien_trang
                );

            }


            if(
                p.Nam_trong
            ){

                namSet.add(
                    p.Nam_trong
                );

            }

        }
    );


    fillSelect(
        "filterGiong",
        [...giongSet].sort()
    );


    fillSelect(
        "filterHienTrang",
        [...hienTrangSet].sort()
    );


    fillSelect(
        "filterNamTrong",
        [...namSet].sort()
    );

}


// ========================================================
// FILL SELECT
// ========================================================

function fillSelect(
    id,
    values
){

    const select =
        document.getElementById(
            id
        );


    values.forEach(
        value => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                value;


            option.textContent =
                value;


            select.appendChild(
                option
            );

        }
    );

}


// ========================================================
// ÁP DỤNG BỘ LỌC
// ========================================================

function applyFilters(){

    const giong =
        document.getElementById(
            "filterGiong"
        ).value;


    const hienTrang =
        document.getElementById(
            "filterHienTrang"
        ).value;


    const namTrong =
        document.getElementById(
            "filterNamTrong"
        ).value;


    const result =
        allFeatures.filter(
            feature => {

                const p =
                    feature.properties ||
                    {};


                const okGiong =
                    !giong ||
                    p.Giong ===
                    giong;


                const okHienTrang =
                    !hienTrang ||
                    p.Hien_trang ===
                    hienTrang;


                const okNam =
                    !namTrong ||
                    String(
                        p.Nam_trong
                    ) ===
                    String(
                        namTrong
                    );


                return (
                    okGiong &&
                    okHienTrang &&
                    okNam
                );

            }
        );


    // Xóa lớp cũ
    if(
        filteredLayer
    ){

        map.removeLayer(
            filteredLayer
        );

    }


    filteredLayer =
        L.geoJSON(

            {

                type:
                    "FeatureCollection",

                features:
                    result

            },

            {

                style:
                    styleLo,

                onEachFeature:
                    onEachFeature

            }

        ).addTo(map);


    updateStatistics(
        result
    );


    if(
        result.length > 0
    ){

        const bounds =
            filteredLayer.getBounds();


        if(
            bounds.isValid()
        ){

            map.fitBounds(
                bounds,
                {
                    padding:[20,20]
                }
            );

        }

    }


    setStatus(

        "Đang hiển thị " +
        result.length +
        " lô.",

        "success"

    );

}


// ========================================================
// XÓA BỘ LỌC
// ========================================================

function clearFilters(){

    document.getElementById(
        "filterGiong"
    ).value = "";


    document.getElementById(
        "filterHienTrang"
    ).value = "";


    document.getElementById(
        "filterNamTrong"
    ).value = "";


    if(
        filteredLayer
    ){

        map.removeLayer(
            filteredLayer
        );

        filteredLayer =
            null;

    }


    if(
        loLayer
    ){

        if(
            !map.hasLayer(
                loLayer
            )
        ){

            loLayer.addTo(map);

        }


        map.fitBounds(
            loLayer.getBounds()
        );


        updateStatistics(
            allFeatures
        );

    }


    setStatus(

        "Đang hiển thị toàn bộ dữ liệu.",

        "success"

    );

}


// ========================================================
// TÌM KIẾM
// ========================================================

function searchLo(){

    const keyword =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    if(
        !keyword
    ){

        alert(
            "Vui lòng nhập thông tin cần tìm."
        );

        return;

    }


    let found =
        null;


    // Ưu tiên các trường quan trọng
    const priorityFields = [

        "Tenlo_moi",
        "Tenlo_cu",
        "Giong",
        "NT_doi",
        "Hien_trang",
        "Nam_trong"

    ];


    // Tìm ưu tiên
    for(
        const feature
        of allFeatures
    ){

        const p =
            feature.properties ||
            {};


        for(
            const field
            of priorityFields
        ){

            const value =
                String(
                    p[field] ??
                    ""
                )
                .toLowerCase();


            if(
                value.includes(
                    keyword
                )
            ){

                found =
                    feature;

                break;

            }

        }


        if(found)
            break;

    }


    // Nếu không thấy,
    // tìm toàn bộ thuộc tính
    if(!found){

        for(
            const feature
            of allFeatures
        ){

            const p =
                feature.properties ||
                {};


            const values =
                Object.values(p);


            const match =
                values.some(
                    value =>
                        String(
                            value ??
                            ""
                        )
                        .toLowerCase()
                        .includes(
                            keyword
                        )
                );


            if(match){

                found =
                    feature;

                break;

            }

        }

    }


    if(!found){

        alert(
            "Không tìm thấy lô hoặc thông tin phù hợp."
        );

        return;

    }


    const temp =
        L.geoJSON(
            found
        );


    const bounds =
        temp.getBounds();


    if(
        bounds.isValid()
    ){

        map.fitBounds(

            bounds,

            {

                maxZoom:18,

                padding:
                    [40,40]

            }

        );

    }


    // tìm layer tương ứng
    if(
        loLayer
    ){

        loLayer.eachLayer(
            layer => {

                if(
                    layer.feature ===
                    found
                ){

                    if(
                        selectedLayer
                    ){

                        loLayer.resetStyle(
                            selectedLayer
                        );

                    }


                    selectedLayer =
                        layer;


                    layer.setStyle({

                        weight:4,

                        color:"#d32f2f",

                        fillColor:"#ffb74d",

                        fillOpacity:.85

                    });


                    layer.openPopup();


                    showInfo(
                        found.properties
                    );

                }

            }
        );

    }


    setStatus(

        "Đã tìm thấy: " +
        (
            found.properties.Tenlo_moi ||
            found.properties.Tenlo_cu ||
            "Lô"
        ),

        "success"

    );

}


// ========================================================
// RESET BẢN ĐỒ
// ========================================================

function resetMap(){

    document.getElementById(
        "searchInput"
    ).value = "";


    clearFilters();


    if(
        selectedLayer &&
        loLayer
    ){

        loLayer.resetStyle(
            selectedLayer
        );

    }


    selectedLayer =
        null;


    infoContent.innerHTML = `

<div class="info-empty">

Click vào một lô trên bản đồ
để xem thông tin.

</div>

`;

}


// ========================================================
// ENTER ĐỂ TÌM KIẾM

document

)

        if(
